<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diccionario operativo de errores PUC — Consubanco</title>
<style>
  :root{
    --navy: #0A2B4C;
    --navy-2: #123A63;
    --blue: #1568E3;
    --blue-dark: #0F4FB0;
    --blue-tint: #E7F0FE;
    --cyan: #17ABB8;
    --cyan-tint: #E3F6F7;
    --amber: #9A6B12;
    --amber-tint: #FBF1DA;
    --green: #1E7A4C;
    --green-tint: #E4F5EC;
    --violet: #6E4CB0;
    --violet-tint: #EFE9F9;
    --gray-tag: #5C6B7A;
    --gray-tag-tint: #EEF1F4;

    --bg: #EEF2F6;
    --surface: #FFFFFF;
    --border: #DCE3EB;
    --border-strong: #C2CCD8;
    --text: #14202E;
    --text-muted: #5C6B7A;
    --text-faint: #8C97A4;

    --radius-sm: 7px;
    --radius-md: 12px;
    --shadow-sm: 0 1px 2px rgba(10,43,76,0.07);
    --shadow-md: 0 8px 24px rgba(10,43,76,0.10);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --tap-min: 44px;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body{
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
    line-height: 1.5;
  }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }

  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }

  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible {
    outline: 2.5px solid var(--blue);
    outline-offset: 2px;
    border-radius: 4px;
  }

  /* ---------- Header ---------- */
  .app-header{
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-2) 100%);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 50;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .brand{
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand-name{
    font-weight: 700;
    font-size: 16px;
    letter-spacing: 0.3px;
  }
  .brand-divider{
    width: 1px;
    height: 16px;
    background: rgba(255,255,255,0.25);
  }
  .brand-product{
    font-size: 13.5px;
    color: rgba(255,255,255,0.78);
    font-weight: 500;
  }
  .view-tabs{
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.09);
    border-radius: var(--radius-sm);
    padding: 3px;
  }
  .view-tab{
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.78);
    padding: 8px 16px;
    min-height: var(--tap-min);
    border-radius: 5px;
    font-size: 13.5px;
    font-weight: 600;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .view-tab[aria-selected="true"]{
    background: #fff;
    color: var(--navy);
  }
  .view-tab:hover:not([aria-selected="true"]){
    background: rgba(255,255,255,0.16);
  }

  /* ---------- KPI ---------- */
  .kpi-bar{
    background: var(--navy-2);
    color: #fff;
    display: flex;
    gap: 0;
    padding: 0 24px;
    overflow-x: auto;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .kpi{
    padding: 10px 22px 10px 0;
    margin-right: 22px;
    border-right: 1px solid rgba(255,255,255,0.14);
    white-space: nowrap;
  }
  .kpi:last-child{ border-right: none; margin-right: 0; }
  .kpi-value{ font-size: 19px; font-weight: 700; }
  .kpi-label{ font-size: 11.5px; color: rgba(255,255,255,0.66); margin-top: 1px; }

  main{ max-width: 1320px; margin: 0 auto; padding: 20px 24px 44px; }

  /* ---------- Vista de consulta ---------- */
  .query-view{
    display: grid;
    grid-template-columns: 420px 1fr;
    gap: 20px;
    align-items: start;
  }

  .search-panel{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }

  .search-controls{
    padding: 18px 18px 14px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 5;
  }

  .search-box{
    display: flex;
    align-items: center;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 0 10px;
    background: var(--bg);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-box:focus-within{
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-tint);
    background: var(--surface);
  }
  .search-box svg{ flex: none; color: var(--text-faint); }
  .search-box input{
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px 8px;
    outline: none;
    color: var(--text);
    font-size: 15.5px;
    min-height: var(--tap-min);
  }
  .search-clear{
    background: transparent;
    border: none;
    color: var(--text-faint);
    padding: 6px 8px;
    border-radius: 5px;
    font-size: 13px;
    font-weight: 600;
    display: none;
    min-height: 32px;
  }
  .search-clear.visible{ display: inline-flex; align-items: center; }
  .search-clear:hover{ color: var(--text); background: var(--border); }

  .filter-row{ margin-top: 12px; }
  .filter-label{
    display: block;
    font-size: 11.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin: 0 0 5px 2px;
  }
  select#filterFuncionalidad{
    width: 100%;
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-sm);
    padding: 10px 10px;
    background: #fff;
    min-height: var(--tap-min);
  }

  .results-meta{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 18px;
    font-size: 12.5px;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .results-meta .clear-filter{
    background: none;
    border: none;
    color: var(--blue-dark);
    font-weight: 700;
    padding: 4px 6px;
    display: none;
    min-height: 32px;
  }
  .results-meta .clear-filter.visible{ display: inline-flex; align-items: center; }
  .results-meta .clear-filter:hover{ text-decoration: underline; }

  .results-list{
    list-style: none;
    margin: 0;
    padding: 6px;
  }
  .result-item{
    display: block;
    width: 100%;
    text-align: left;
    background: transparent;
    border: 1.5px solid transparent;
    border-radius: var(--radius-sm);
    padding: 12px 12px;
    margin-bottom: 3px;
    min-height: var(--tap-min);
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .result-item:hover{ background: var(--bg); }
  .result-item[aria-current="true"]{
    background: var(--blue-tint);
    border-color: var(--blue);
  }
  .result-code{
    font-weight: 700;
    font-size: 14.5px;
    color: var(--navy);
    letter-spacing: 0.2px;
  }
  .result-item[aria-current="true"] .result-code{ color: var(--blue-dark); }
  .result-meta{
    display: flex;
    gap: 8px;
    align-items: center;
    margin-top: 5px;
    font-size: 12.5px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  .func-chip{
    display: inline-flex;
    align-items: center;
    gap: 6px;
    max-width: 100%;
  }
  .func-dot{
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
  }
  .func-name{
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tipo-badge{
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    font-weight: 700;
    padding: 2.5px 8px;
    border-radius: 100px;
    letter-spacing: 0.15px;
    white-space: nowrap;
  }

  .empty-state{
    padding: 46px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .empty-state .empty-title{ font-weight: 700; color: var(--text); margin-bottom: 4px; font-size: 15px; }

  /* ---------- Ficha ---------- */
  .detail-panel{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: 26px 30px 30px;
    position: sticky;
    top: 88px;
  }
  .detail-empty{
    padding: 70px 20px;
    text-align: center;
    color: var(--text-faint);
    font-size: 14.5px;
  }
  .detail-eyebrow{
    font-size: 11.5px;
    font-weight: 700;
    color: var(--cyan);
    letter-spacing: 0.6px;
    margin-bottom: 8px;
  }
  .detail-code{
    font-size: 28px;
    font-weight: 800;
    color: var(--navy);
    letter-spacing: 0.3px;
    line-height: 1.15;
  }
  .detail-tags{
    display: flex;
    gap: 10px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }
  .tag-funcionalidad{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 100px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .tag-funcionalidad .func-dot{ width: 10px; height: 10px; }
  .tag-tipo{ font-size: 12.5px; padding: 5px 12px; }

  hr.detail-divider{ border: none; border-top: 1px solid var(--border); margin: 22px 0 0; }

  .detail-section{ margin-top: 22px; }
  .detail-section h3{
    font-size: 12px;
    color: var(--text-muted);
    margin: 0 0 8px;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .cuando-text{
    color: var(--text);
    font-size: 14.5px;
    white-space: pre-line;
  }
  .cuando-text.muted{ color: var(--text-faint); }

  .instruccion-box{
    background: var(--blue-tint);
    border: 1px solid #CBDEFB;
    border-left: 4px solid var(--blue);
    border-radius: var(--radius-sm);
    padding: 16px 18px;
  }
  .instruccion-box.muted{
    background: var(--bg);
    border-color: var(--border);
    border-left-color: var(--border-strong);
  }
  .instruccion-text{
    white-space: pre-line;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
  }
  .instruccion-text.muted{ color: var(--text-faint); font-weight: 400; }
  .instruccion-steps{
    margin: 0;
    padding-left: 20px;
    color: var(--text);
    font-size: 15px;
    font-weight: 500;
  }
  .instruccion-steps li{ margin-bottom: 8px; }
  .instruccion-steps li:last-child{ margin-bottom: 0; }

  /* ---------- Vista inventario ---------- */
  .inventory-view{ display: none; }
  .inventory-intro{
    color: var(--text-muted);
    font-size: 13.5px;
    margin: 0 0 16px;
    max-width: 720px;
  }
  .inventory-list{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
    padding: 8px;
  }
  .inv-row-wrap + .inv-row-wrap{ border-top: 1px solid var(--border); }
  .inv-row{
    display: grid;
    grid-template-columns: 26px 240px 1fr 60px;
    align-items: center;
    gap: 14px;
    padding: 14px 14px;
    border-radius: var(--radius-sm);
  }
  .inv-row-wrap:hover .inv-row{ background: var(--bg); }
  .inv-dot-cell{ display: flex; justify-content: center; }
  .inv-name-btn{
    background: none;
    border: none;
    text-align: left;
    font-weight: 700;
    color: var(--navy);
    padding: 8px 0;
    min-height: var(--tap-min);
    font-size: 14.5px;
  }
  .inv-name-btn:hover{ color: var(--blue-dark); text-decoration: underline; }
  .inv-count{ font-size: 12px; color: var(--text-muted); margin-top: 1px; font-weight: 500; }
  .inv-bar-track{
    background: var(--bg);
    border-radius: 5px;
    height: 12px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .inv-bar-fill{ height: 100%; border-radius: 5px 0 0 5px; }
  .inv-pct{ text-align: right; font-weight: 700; font-size: 13.5px; color: var(--text); }

  .inv-codes{
    grid-column: 1 / -1;
    display: none;
    flex-wrap: wrap;
    gap: 7px;
    margin-top: 4px;
    margin-bottom: 6px;
    padding: 12px 14px;
    background: var(--bg);
    border-radius: var(--radius-sm);
  }
  .inv-codes.open{ display: flex; }
  .inv-code-chip{
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--navy);
    min-height: 32px;
  }
  .inv-code-chip:hover{ background: var(--blue-tint); border-color: var(--blue); color: var(--blue-dark); }

  .sr-only{
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 860px){
    main{ padding: 14px 12px 34px; }
    .query-view{ grid-template-columns: 1fr; }
    .detail-panel{ position: static; }
    .app-header{ padding: 12px 14px; }
    .kpi-bar{ padding: 0 14px; }
    .inv-row{ grid-template-columns: 20px 1fr 46px; }
    .inv-row .inv-name-cell{ grid-column: 2 / 3; }
    .inv-row .inv-bar-track{ grid-column: 1 / -1; }
    body.mobile-detail-open .query-view .search-panel{ display: none; }
    body:not(.mobile-detail-open) .query-view .detail-panel{ display: none; }
    .back-to-results{
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--blue-dark);
      font-weight: 700;
      padding: 10px 0 16px;
      min-height: var(--tap-min);
    }
  }
  @media (min-width: 861px){
    .back-to-results{ display: none; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-name">Consubanco</span>
    <span class="brand-divider" aria-hidden="true"></span>
    <span class="brand-product">Diccionario operativo de errores PUC</span>
  </div>
  <div class="view-tabs" role="tablist" aria-label="Vistas">
    <button class="view-tab" id="tabConsulta" role="tab" aria-selected="true" aria-controls="viewConsulta">Consulta de errores</button>
    <button class="view-tab" id="tabInventario" role="tab" aria-selected="false" aria-controls="viewInventario">Inventario por funcionalidad</button>
  </div>
</header>

<div class="kpi-bar" id="kpiBar" aria-label="Indicadores del inventario"></div>

<main>
  <section class="query-view" id="viewConsulta" role="tabpanel" aria-labelledby="tabConsulta">
    <div class="search-panel">
      <div class="search-controls">
        <div class="search-box">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <label for="searchInput" class="sr-only">Buscar código de error</label>
          <input type="text" id="searchInput" placeholder="Buscar código, por ejemplo: RWPD2" autocomplete="off" aria-describedby="resultsCount">
          <button class="search-clear" id="searchClear" type="button" aria-label="Limpiar búsqueda">Limpiar</button>
        </div>
        <div class="filter-row">
          <label for="filterFuncionalidad" class="filter-label">Funcionalidad</label>
          <select id="filterFuncionalidad"></select>
        </div>
      </div>
      <div class="results-meta">
        <span id="resultsCount" aria-live="polite">275 códigos</span>
        <button class="clear-filter" id="clearFilterBtn" type="button">Ver todas</button>
      </div>
      <button class="back-to-results" id="backToResults" type="button">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Volver a resultados
      </button>
      <ul class="results-list" id="resultsList" aria-label="Resultados de búsqueda"></ul>
    </div>

    <div class="detail-panel" id="detailPanel" aria-live="polite" tabindex="-1">
      <div class="detail-empty">Selecciona un código para consultar su ficha.</div>
    </div>
  </section>

  <section class="inventory-view" id="viewInventario" role="tabpanel" aria-labelledby="tabInventario" hidden>
    <p class="inventory-intro">Distribución de los códigos documentados por funcionalidad. Selecciona una funcionalidad o un código para consultarlo.</p>
    <div class="inventory-list" id="inventoryList"></div>
  </section>
</main>

iento"},{"categoria":"Login/ Enrolamiento","tipo":"Técnico","codigo":"5VXBU","cuando":"Cuando el cliente no cuenta con Client ID y marca error al crear su contraseña","instruccion":"1. ATC debe levantar un ticket para que se contabilice\n2. Durante la llamada, solicitar al cliente se enrole de nuevo"},{"categoria":"Enrolamiento","tipo":"Técnico","codigo":"9X567","cuando":"Cuando el cliente no cuenta con Client ID y se interrumpe el registro","instruccion":"1. ATC debe levantar un ticket para que se contabilice\n2. Continúa enrolamiento"},{"categoria":"Transferencias","tipo":"Técnico","codigo":"ITXPJ","cuando":"Cuando se intenta transferir a una institución que cambio de razón social y el catálogo no fue actualizado en CRM (ej. Lo que vivimos con NU)","instruccion":"1. ATC. debe levantar ticket\n2. Niveles 1 y 2, notificar a los equipos correspondientes para que sea revisado y atendido (Act. de catálogos)\n3. Solicitar al cliente que espere la respuesta"},{"categoria":"Transferencias","tipo":"Técnico","codigo":"TEA0K","cuando":"Falla de T-OTP (Token UV). El token cuando llega al canal esta expirado","instruccion":"1. ATC debe levantar un ticket para que se contabilice\n2. Solicita al cliente que reintente la operación"},{"categoria":"Enrolamiento","tipo":"Técnico","codigo":"P0ZZD","cuando":"Cuando el cliente intenta hacer el proceso de registro (enrolamiento) y no tiene un teléfono asociado en CRM","instruccion":"1. ATC debe levantar un ticket en el CAI para que se haga la actualización del teléfono\n2. El CAI actualiza teléfono\n3. ATC solicita al cliente que reintente"},{"categoria":"Enrolamiento","tipo":"Técnico","codigo":"MTRZX","cuando":"Cuando el usuario intenta realizar su proceso de registro y hay una falla interna - error en comunicación de servicios","instruccion":"1. ATC debe levantar un ticket para que se contabilice\n2. Se solicita al cliente que reintente el registro omitiendo el error"},{"categoria":"Transferencias","tipo":"Técnico","codigo":"TXJ6K","c <script>
(function(){
  "use strict";

  var RECORDS = JSON.parse(document.getElementById('records-data').textContent);
  var PLACEHOLDER = "Sin información documentada";
  var SIN_FUNCIONALIDAD = "Sin funcionalidad documentada";
  var SIN_TIPO = "Sin tipo documentado";

  function esc(str){
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function displayVal(v, placeholder){
    return (v === null || v === undefined || v === '') ? (placeholder || PLACEHOLDER) : v;
  }

  // ---- Deterministic color per funcionalidad ----
  function hashString(str){
    var h = 0;
    for(var i = 0; i < str.length; i++){
      h = ((h << 5) - h) + str.charCodeAt(i);
      h |= 0;
    }
    return Math.abs(h);
  }
  var funcColorCache = {};
  function funcColor(name){
    if(funcColorCache[name]) return funcColorCache[name];
    var hue = hashString(name) % 360;
    var color = {
      dot: 'hsl(' + hue + ', 48%, 42%)',
      bar: 'hsl(' + hue + ', 52%, 46%)'
    };
    funcColorCache[name] = color;
    return color;
  }

  // ---- Tipo badge styling ----
  var TIPO_STYLE = {
    'Técnico':          { bg: 'var(--blue-tint)',   fg: 'var(--blue-dark)' },
    'Regla de negocio': { bg: 'var(--amber-tint)',  fg: 'var(--amber)' },
    'Usuario':          { bg: 'var(--green-tint)',  fg: 'var(--green)' },
    'Negocio':          { bg: 'var(--violet-tint)', fg: 'var(--violet)' }
  };
  var TIPO_DEFAULT = { bg: 'var(--gray-tag-tint)', fg: 'var(--gray-tag)' };
  function tipoStyle(tipo){
    if(tipo && TIPO_STYLE[tipo]) return TIPO_STYLE[tipo];
    return TIPO_DEFAULT;
  }
  function tipoBadgeHtml(tipo){
    var label = displayVal(tipo, SIN_TIPO);
    var st = tipoStyle(tipo);
    return '<span class="tipo-badge" style="background:' + st.bg + ';color:' + st.fg + '">' + esc(label) + '</span>';
  }
  function funcChipHtml(categoria, extraClass){
    var label = displayVal(categoria, SIN_FUNCIONALIDAD);
    var col = funcColor(label);
    return '<span class="func-chip' + (extraClass ? ' ' + extraClass : '') + '">' +
      '<span class="func-dot" style="background:' + col.dot + '" aria-hidden="true"></span>' +
      '<span class="func-name">' + esc(label) + '</span>' +
    '</span>';
  }

  // ---- Derived aggregates ----
  var totalCodigos = RECORDS.length;
  var funcionalidadMap = {}; // name -> records[]

  RECORDS.forEach(function(r){
    var fkey = r.categoria || SIN_FUNCIONALIDAD;
    if(!funcionalidadMap[fkey]) funcionalidadMap[fkey] = [];
    funcionalidadMap[fkey].push(r);
  });

  var funcionalidades = Object.keys(funcionalidadMap).sort(function(a,b){
    return funcionalidadMap[b].length - funcionalidadMap[a].length;
  });

  var totalFuncionalidades = funcionalidades.length;

  // ---- KPI bar ----
  function renderKpis(){
    var kpis = [
      { value: totalCodigos, label: 'Total de códigos' },
      { value: totalFuncionalidades, label: 'Total de funcionalidades' }
    ];
    var html = kpis.map(function(k){
      return '<div class="kpi"><div class="kpi-value">' + esc(k.value) + '</div><div class="kpi-label">' + esc(k.label) + '</div></div>';
    }).join('');
    document.getElementById('kpiBar').innerHTML = html;
  }

  // ---- Filter select ----
  function populateFilterSelect(){
    var select = document.getElementById('filterFuncionalidad');
    var opts = ['<option value="">Todas las funcionalidades (' + totalCodigos + ')</option>'];
    funcionalidades.forEach(function(f){
      opts.push('<option value="' + esc(f) + '">' + esc(f) + ' (' + funcionalidadMap[f].length + ')</option>');
    });
    select.innerHTML = opts.join('');
  }

  // ---- State ----
  var state = {
    query: '',
    funcionalidad: '',
    selectedCode: null
  };

  function getFiltered(){
    var q = state.query.trim().toLowerCase();
    return RECORDS.filter(function(r){
      if(state.funcionalidad){
        var fkey = r.categoria || SIN_FUNCIONALIDAD;
        if(fkey !== state.funcionalidad) return false;
      }
      if(q){
        if(r.codigo.toLowerCase().indexOf(q) === -1) return false;
      }
      return true;
    });
  }

  function renderResults(){
    var filtered = getFiltered();
    var list = document.getElementById('resultsList');
    var countEl = document.getElementById('resultsCount');
    var clearFilterBtn = document.getElementById('clearFilterBtn');

    countEl.textContent = filtered.length + (filtered.length === 1 ? ' código encontrado' : ' códigos encontrados');
    clearFilterBtn.classList.toggle('visible', !!state.funcionalidad);

    if(filtered.length === 0){
      list.innerHTML = '<li class="empty-state"><div class="empty-title">No encontramos un código con ese criterio</div><div>Verifica el código o quita el filtro de funcionalidad.</div></li>';
      return;
    }

    list.innerHTML = filtered.map(function(r){
      var current = (r.codigo === state.selectedCode);
      return '<li>' +
        '<button class="result-item" type="button" data-code="' + esc(r.codigo) + '" aria-current="' + (current ? 'true' : 'false') + '">' +
          '<div class="result-code">' + esc(r.codigo) + '</div>' +
          '<div class="result-meta">' +
            funcChipHtml(r.categoria) +
            tipoBadgeHtml(r.tipo) +
          '</div>' +
        '</button>' +
      '</li>';
    }).join('');
  }

  // Convert a numbered instruction ("1. ...\n2. ...") into an ordered list without altering the text.
  function renderInstruccion(text){
    if(!text){
      return '<div class="instruccion-box muted"><div class="instruccion-text muted">' + esc(PLACEHOLDER) + '</div></div>';
    }
    var lines = text.split('\n');
    var stepPattern = /^\s*\d+[.)]\s*/;
    var isStepped = lines.length > 1 && lines.filter(function(l){ return l.trim() !== ''; }).every(function(l){ return stepPattern.test(l); });

    if(isStepped){
      var items = lines.filter(function(l){ return l.trim() !== ''; }).map(function(l){
        var content = l.replace(stepPattern, '');
        return '<li>' + esc(content) + '</li>';
      }).join('');
      return '<div class="instruccion-box"><ol class="instruccion-steps">' + items + '</ol></div>';
    }
    return '<div class="instruccion-box"><div class="instruccion-text">' + esc(text) + '</div></div>';
  }

  function renderDetail(){
    var panel = document.getElementById('detailPanel');
    if(!state.selectedCode){
      panel.innerHTML = '<div class="detail-empty">Selecciona un código para consultar su ficha.</div>';
      return;
    }
    var r = RECORDS.filter(function(x){ return x.codigo === state.selectedCode; })[0];
    if(!r){
      panel.innerHTML = '<div class="detail-empty">Selecciona un código para consultar su ficha.</div>';
      return;
    }
    panel.innerHTML =
      '<div class="detail-eyebrow">Ficha operativa</div>' +
      '<div class="detail-code">' + esc(r.codigo) + '</div>' +
      '<div class="detail-tags">' +
        funcChipHtml(r.categoria, 'tag-funcionalidad') +
        tipoBadgeHtml(r.tipo) +
      '</div>' +
      '<hr class="detail-divider">' +
      '<div class="detail-section">' +
        '<h3>¿Cuándo ocurre?</h3>' +
        '<div class="cuando-text' + (r.cuando ? '' : ' muted') + '">' + esc(displayVal(r.cuando)) + '</div>' +
      '</div>' +
      '<div class="detail-section">' +
        '<h3>Instrucción de atención</h3>' +
        renderInstruccion(r.instruccion) +
      '</div>';
  }

  function selectCode(code, opts){
    state.selectedCode = code;
    renderResults();
    renderDetail();
    if(opts && opts.mobileOpen){
      document.body.classList.add('mobile-detail-open');
    }
    var panel = document.getElementById('detailPanel');
    if(panel) panel.focus();
  }

  // ---- Event wiring: consulta view ----
  document.getElementById('searchInput').addEventListener('input', function(e){
    state.query = e.target.value;
    document.getElementById('searchClear').classList.toggle('visible', !!state.query);
    renderResults();
  });

  document.getElementById('searchClear').addEventListener('click', function(){
    state.query = '';
    var input = document.getElementById('searchInput');
    input.value = '';
    input.focus();
    this.classList.remove('visible');
    renderResults();
  });

  document.getElementById('filterFuncionalidad').addEventListener('change', function(e){
    state.funcionalidad = e.target.value;
    renderResults();
  });

  document.getElementById('clearFilterBtn').addEventListener('click', function(){
    state.funcionalidad = '';
    document.getElementById('filterFuncionalidad').value = '';
    renderResults();
  });

  document.getElementById('resultsList').addEventListener('click', function(e){
    var btn = e.target.closest('.result-item');
    if(!btn) return;
    selectCode(btn.getAttribute('data-code'), { mobileOpen: true });
  });

  document.getElementById('backToResults').addEventListener('click', function(){
    document.body.classList.remove('mobile-detail-open');
  });

  // ---- Vista inventario ----
  function renderInventory(){
    var container = document.getElementById('inventoryList');
    var maxCount = funcionalidadMap[funcionalidades[0]].length;

    container.innerHTML = funcionalidades.map(function(f, idx){
      var recs = funcionalidadMap[f];
      var pct = ((recs.length / totalCodigos) * 100).toFixed(1);
      var barPct = ((recs.length / maxCount) * 100).toFixed(1);
      var col = funcColor(f);
      var rowId = 'inv-codes-' + idx;
      var codesHtml = recs.map(function(r){
        return '<button class="inv-code-chip" type="button" data-code="' + esc(r.codigo) + '" data-func="' + esc(f) + '" style="border-color:' + col.dot + '55">' + esc(r.codigo) + '</button>';
      }).join('');

      return '<div class="inv-row-wrap">' +
        '<div class="inv-row">' +
          '<div class="inv-dot-cell"><span class="func-dot" style="background:' + col.dot + '" aria-hidden="true"></span></div>' +
          '<div class="inv-name-cell">' +
            '<button class="inv-name-btn" type="button" data-toggle="' + rowId + '" aria-expanded="false" aria-controls="' + rowId + '">' + esc(f) + '</button>' +
            '<div class="inv-count">' + recs.length + (recs.length === 1 ? ' código' : ' códigos') + '</div>' +
          '</div>' +
          '<div class="inv-bar-track"><div class="inv-bar-fill" style="width:' + barPct + '%;background:' + col.bar + '"></div></div>' +
          '<div class="inv-pct">' + pct + '%</div>' +
          '<div class="inv-codes" id="' + rowId + '">' + codesHtml + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  function goToConsultaWithFuncionalidad(func){
    switchView('consulta');
    state.funcionalidad = func;
    document.getElementById('filterFuncionalidad').value = func;
    renderResults();
  }

  document.getElementById('inventoryList').addEventListener('click', function(e){
    var toggleBtn = e.target.closest('.inv-name-btn');
    if(toggleBtn){
      var id = toggleBtn.getAttribute('data-toggle');
      var codesEl = document.getElementById(id);
      var isOpen = codesEl.classList.toggle('open');
      toggleBtn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      return;
    }
    var chip = e.target.closest('.inv-code-chip');
    if(chip){
      var func = chip.getAttribute('data-func');
      var code = chip.getAttribute('data-code');
      goToConsultaWithFuncionalidad(func);
      selectCode(code, { mobileOpen: true });
    }
  });

  // ---- View switching ----
  function switchView(view){
    var isConsulta = (view === 'consulta');
    document.getElementById('viewConsulta').hidden = !isConsulta;
    document.getElementById('viewInventario').hidden = isConsulta;
    document.getElementById('tabConsulta').setAttribute('aria-selected', isConsulta ? 'true' : 'false');
    document.getElementById('tabInventario').setAttribute('aria-selected', isConsulta ? 'false' : 'true');
  }

  document.getElementById('tabConsulta').addEventListener('click', function(){ switchView('consulta'); });
  document.getElementById('tabInventario').addEventListener('click', function(){ switchView('inventario'); });

  // ---- Init ----
  renderKpis();
  populateFilterSelect();
  renderResults();
  renderDetail();
  renderInventory();

})();
</script>
</body>
</html>
